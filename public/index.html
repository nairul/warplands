<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warplands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: a war table seen from above. Opponent's tableau at the top, the four era stacks across the middle, your tableau and hand at the bottom. */
:root{
  --table:#16282a; --table-2:#1d3335; --rail:#2b4547; --line:#36585a;
  --fg:#e6ede8; --muted:#97aeaa;
  --paper:#eee5cf; --paper-2:#e2d6ba; --ink:#2a2318; --ink-soft:#6a5d47;
  --brass:#d6a94f; --brass-ink:#2a1f08;
  --follower:#4d86e2; --damage:#c9473b;
  --era1:#e2b21c; --era2:#e5771e; --era3:#cf3b30; --era4:#8a52c2;
  --era-ink-1:#2b2004; --era-ink-2:#2e1503; --era-ink-3:#ffffff; --era-ink-4:#ffffff;
  --display:'Cinzel', 'Trajan Pro', Georgia, serif;
  --body:'Barlow Semi Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
body{background:radial-gradient(ellipse at 50% 40%, var(--table-2), var(--table) 70%) fixed, var(--table);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.35;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,[data-site]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

#app{max-width:1180px;margin:0 auto;padding-block:10px 120px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.08em;font-size:20px;color:var(--brass)}
.turnline{font-size:14px;color:var(--muted)}
.turnline b{color:var(--fg)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 12px;color:var(--muted)}
.ghost:hover{color:var(--fg);border-color:var(--muted)}

/* Zones */
.zone{border:1px solid var(--line);border-radius:10px;padding:12px;background:color-mix(in srgb, var(--table) 70%, transparent);display:flex;flex-direction:column;gap:10px}
.zone.active{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.zhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pname{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.04em}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--fg);font-size:16px}
.lvl{font-family:var(--display);font-weight:800;font-size:12px;padding:2px 8px;border-radius:4px;color:var(--era-ink,#fff);letter-spacing:.06em}
.dot{width:12px;height:12px;border-radius:50%;background:var(--follower);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);display:inline-block}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;min-width:0;align-items:flex-start}
.row::-webkit-scrollbar{height:6px}.row::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.backs{display:flex}
.back{min-width:18px;height:26px;padding:0 2px;border-radius:3px;background:var(--era);color:var(--era-ink);border:1px solid rgba(0,0,0,.35);margin-left:-3px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:9.5px;line-height:1;box-shadow:1px 0 0 rgba(0,0,0,.25)}
.back:first-child{margin-left:0}
.empty{color:var(--muted);font-size:13px;font-style:italic;padding:8px 0}

/* Cards */
.card{flex:0 0 auto;width:158px;background:var(--paper);color:var(--ink);border-radius:8px;padding:0 0 8px;display:flex;flex-direction:column;gap:6px;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.35);border:none;text-align:left;overflow:hidden}
.card .band{display:flex;align-items:center;gap:6px;padding:6px 8px;color:var(--era-ink);background:var(--era)}
.card .lv{font-family:var(--display);font-weight:800;font-size:12px;opacity:.9;min-width:18px}
.card .nm{font-family:var(--display);font-weight:600;font-size:13.5px;line-height:1.1;flex:1;min-width:0;text-wrap:balance}
.card .ty{display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.18);border-radius:10px;padding:2px 6px 2px 4px;font-weight:700;font-size:13px}
.card .ty svg{width:13px;height:13px;fill:currentColor}
.card .tx{font-size:13px;padding:0 8px;color:var(--ink)}
.card .kind{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);padding:0 8px;display:flex;justify-content:space-between;gap:8px}
.ph{color:var(--damage);font-weight:700}
.era-1{--era:var(--era1);--era-ink:var(--era-ink-1)}.era-2{--era:var(--era2);--era-ink:var(--era-ink-2)}.era-3{--era:var(--era3);--era-ink:var(--era-ink-3)}.era-4{--era:var(--era4);--era-ink:var(--era-ink-4)}
.lvl.era-1,.lvl.era-2,.lvl.era-3,.lvl.era-4{background:var(--era)}

.hand .card{cursor:default}
.hand .card.playable{cursor:pointer}
.hand .card.playable:hover{transform:translateY(-3px)}
.hand .card:not(.playable){opacity:.72}
.hand .card{transition:transform .12s}

.site{width:176px}
.site.target{outline:3px solid var(--brass);outline-offset:2px;cursor:pointer;animation:pulse 1.2s infinite}
@keyframes pulse{50%{outline-color:#fff3}}
.abs{display:flex;flex-direction:column;gap:4px;padding:0 6px}
.ab{display:flex;gap:6px;align-items:flex-start;background:var(--paper-2);border:1px solid transparent;border-radius:6px;padding:5px 6px;font-size:12.5px;color:var(--ink);text-align:left;line-height:1.25}
button.ab:not(:disabled){background:#fff7e2;border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
button.ab:not(:disabled):hover{background:#ffeec2}
button.ab:disabled{opacity:.75}
.req{display:inline-flex;gap:3px;flex:0 0 auto;font-weight:700;font-variant-numeric:tabular-nums}
.rq{display:inline-flex;align-items:center;gap:2px;border-radius:4px;padding:0 4px;color:#fff;font-size:11.5px;line-height:17px}
.rq.f{background:var(--follower)}.rq.a{background:var(--ink)}.rq.inf{background:var(--era4)}
.used{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;padding:0 8px}
.foot{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 0;border-top:1px dashed #0002;margin:0 0;gap:6px}
.tokens{display:flex;flex-wrap:wrap;gap:3px;align-items:center;max-width:100px}
.tokens .n{font-weight:700;font-size:14px;margin-left:3px;font-variant-numeric:tabular-nums}
.integ{display:flex;gap:3px;align-items:center}
.integ i{width:9px;height:12px;border:1.5px solid var(--ink-soft);border-radius:2px;display:inline-block}
.integ i.hit{background:var(--damage);border-color:var(--damage)}
.atts{display:flex;flex-direction:column;gap:3px;padding:0 6px}
.att{font-size:11.5px;background:var(--ink);color:var(--paper);border-radius:4px;padding:3px 6px;line-height:1.25}
.att b{font-family:var(--display);font-weight:600;letter-spacing:.03em}

/* Middle table */
.mid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.stacks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stack{background:var(--era);border:none;border-radius:8px;padding:10px 6px 8px;color:var(--era-ink);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:118px;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.4), 0 6px 0 -1px color-mix(in srgb, var(--era) 60%, black)}
.stack .rn{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.stack .cnt{font-size:13px;opacity:.9;font-variant-numeric:tabular-nums}
.stack .hint{font-size:11.5px;opacity:.85;text-align:center}
.stack:not(:disabled):hover{filter:brightness(1.12)}
.stack:disabled{filter:saturate(.45) brightness(.75)}
.stack.out{filter:grayscale(1) brightness(.5)}
.markers{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:auto}
.mk{font-size:10.5px;color:#fff;background:rgba(0,0,0,.45);border-radius:3px;padding:1px 5px;text-transform:uppercase;letter-spacing:.05em}
.sideinfo{display:flex;flex-direction:column;gap:8px;min-width:0}
.discard{font-size:13px;color:var(--muted)}
.discard b{color:var(--fg)}
.log{list-style:none;margin:0;padding:8px 10px;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:8px;height:128px;overflow-y:auto;font-size:13px;display:flex;flex-direction:column;gap:3px}
.log li{color:var(--muted)}
.log li:first-child{color:var(--fg)}

/* Controls */
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pips{display:flex;gap:5px;align-items:center;margin-right:6px}
.pip{width:16px;height:16px;border-radius:50%;border:2px solid var(--brass)}
.pip.on{background:var(--brass)}
.btn{background:var(--rail);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-weight:600}
.btn:not(:disabled):hover{border-color:var(--brass)}
.btn:disabled{opacity:.45}
.btn .c{font-weight:500;color:var(--muted);margin-left:4px;font-size:13px}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.primary.nudge{animation:glow 1.4s infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px #d6a94f44}}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

/* Prompt bar */
.prompt{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--brass);color:var(--brass-ink);padding-block:12px calc(12px + env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-shadow:0 -6px 20px rgba(0,0,0,.4)}
.prompt .in{max-width:1180px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.prompt p{margin:0;font-weight:600;font-size:15px;max-width:65ch}
.prompt .opts{display:flex;gap:8px;flex-wrap:wrap}
.prompt button{background:var(--brass-ink);color:var(--paper);border:none;border-radius:6px;padding:7px 14px;font-weight:600}
.prompt button.sec{background:transparent;color:var(--brass-ink);border:1.5px solid var(--brass-ink)}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(8,16,17,.82);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top, 0px));padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px));overflow-y:auto}
.panel{background:var(--table-2);border:1px solid var(--line);border-radius:12px;padding:24px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow-y:auto}
.panel h1{font-family:var(--display);font-weight:800;color:var(--brass);letter-spacing:.08em;margin:0;font-size:34px;line-height:1.05;text-wrap:balance}
.panel h2{font-family:var(--display);font-weight:600;margin:0;font-size:22px;text-wrap:balance}
.panel p{margin:0;color:var(--muted);max-width:65ch}
.panel .choices{display:flex;gap:10px;flex-wrap:wrap}
.panel details{color:var(--muted);font-size:14px}
.panel details summary{cursor:pointer;color:var(--fg);font-weight:600}
.panel details ul{padding-left:18px;margin:8px 0 0;display:flex;flex-direction:column;gap:4px}
.eras{display:flex;height:6px;border-radius:3px;overflow:hidden}
.eras span{flex:1}
.fine{font-size:12px;color:var(--muted)}
.reloc{display:flex;flex-direction:column;gap:8px}
.rl{display:flex;align-items:center;gap:10px;background:var(--rail);border-radius:8px;padding:8px 10px}
.rl .nm{flex:1;min-width:0}
.rl .nm b{font-family:var(--display);font-weight:600}
.rl .nm small{display:block;color:var(--muted)}
.rl .n{width:28px;text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.rl button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--table);font-weight:700;font-size:18px;line-height:1}
.rl button:disabled{opacity:.35}
.pool{display:flex;align-items:center;gap:8px;font-weight:600}

.hand .card.target{outline:3px solid var(--brass);outline-offset:2px;opacity:1;cursor:pointer;animation:pulse 1.2s infinite}
.tuck{font-size:11.5px;color:var(--ink-soft);padding:0 8px}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg .label{margin-right:4px}
.seg button{background:var(--rail);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:600}
.setmark{font-size:10px;letter-spacing:.06em;color:var(--ink-soft)}
.ab.passive{background:transparent;border:1px dashed #6a5d4788}
.ab .auto{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-top:2px}
.warn{color:#f0b35a}
.online{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.fieldrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fieldrow label{font-size:13px;color:var(--muted);min-width:88px}
.fieldrow input{font:inherit;background:var(--table);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;flex:1 1 140px;max-width:220px}
.fieldrow input:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.code{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:.18em;color:var(--brass);text-align:center;padding:8px 0;user-select:all}
@media (max-width:760px){
  .mid{grid-template-columns:minmax(0,1fr)}
  .card{width:146px}.site{width:162px}
  .log{height:96px}
  .stack{min-height:96px}
  .stack .rn{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">WARPLANDS</div>
    <div class="turnline" id="turnline"></div>
    <div class="seg"><button class="ghost" id="soundBtn" aria-pressed="true">Sound on</button><button class="ghost" id="menuBtn">Menu</button></div>
  </div>
  <section class="zone" id="oppZone"></section>
  <section class="mid" id="mid"></section>
  <section class="zone" id="meZone"></section>
</div>
<div class="prompt" id="prompt" hidden></div>
<div class="overlay" id="overlay" hidden></div>
<script type="module">
import {createGame} from './game.js';
createGame();
</script>
</body>
</html>
